<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7A45"/>
      <stop offset="100%" stop-color="#FF5722"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Track ring -->
  <circle cx="256" cy="272" r="140" fill="none" stroke="#222238" stroke-width="16"/>

  <!-- Progress arc (~70%) -->
  <circle cx="256" cy="272" r="140" fill="none" stroke="url(#accent)" stroke-width="16" stroke-linecap="round"
    stroke-dasharray="620 880" stroke-dashoffset="-220"
    transform="rotate(-90 256 272)"/>

  <!-- Stopwatch button -->
  <rect x="243" y="88" width="26" height="20" rx="6" fill="#e8e8ec"/>

  <!-- Center point -->
  <circle cx="256" cy="272" r="8" fill="#e8e8ec"/>

  <!-- Hand pointing up-right (~2 o'clock) -->
  <line x1="256" y1="272" x2="310" y2="190" stroke="#e8e8ec" stroke-width="6" stroke-linecap="round"/>
</svg>
LA S
