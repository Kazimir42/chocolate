<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="100%" style="stop-color:#FF8C5A"/>
    </linearGradient>
    <linearGradient id="coralGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7F66"/>
      <stop offset="100%" style="stop-color:#FF6B35"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGradient)"/>

  <!-- Glass effect circle -->
  <circle cx="256" cy="270" r="160" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

  <!-- Timer circle outline -->
  <circle cx="256" cy="270" r="130" fill="none" stroke="url(#orangeGradient)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Progress arc (about 75%) -->
  <path d="M 256 140 A 130 130 0 1 1 156 340" fill="none" stroke="url(#coralGradient)" stroke-width="12" stroke-linecap="round" opacity="0.4"/>

  <!-- Timer top button -->
  <rect x="236" y="80" width="40" height="30" rx="8" fill="url(#orangeGradient)"/>
  <rect x="248" y="65" width="16" height="25" rx="4" fill="url(#orangeGradient)"/>

  <!-- Center dot -->
  <circle cx="256" cy="270" r="12" fill="url(#orangeGradient)" filter="url(#glow)"/>

  <!-- Timer hand -->
  <line x1="256" y1="270" x2="256" y2="170" stroke="url(#orangeGradient)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Small tick marks -->
  <g stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round">
    <line x1="256" y1="150" x2="256" y2="165"/>
    <line x1="361" y1="270" x2="346" y2="270"/>
    <line x1="256" y1="390" x2="256" y2="375"/>
    <line x1="151" y1="270" x2="166" y2="270"/>
  </g>
</svg>
